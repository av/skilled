name: Desktop

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "index/**"
      - "src/models.ts"
      - "src/data.ts"
      - "src/view.ts"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "index/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
            args: ""
          - name: macos-universal
            os: macos-latest
            args: "--target universal-apple-darwin"
          - name: windows-x64
            os: windows-latest
            args: ""

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos-universal' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: desktop-${{ matrix.name }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: desktop-${{ matrix.name }}-

      - name: Linux system deps (WebKitGTK, tray, AppImage tooling, Xvfb for e2e)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb ffmpeg

      - name: Install
        working-directory: desktop
        run: bun install

      - name: Typecheck
        working-directory: desktop
        run: bun run typecheck

      - name: Unit tests (view models, data adapter, 50k-call perf budget)
        working-directory: desktop
        run: bun test tests/unit

      - name: Bundle UI
        working-directory: desktop
        run: bun run build:ui

      - name: Rust tests (Tauri commands over IPC on the mock runtime, index reader, settings, watcher)
        working-directory: desktop/src-tauri
        run: cargo test

      - name: Debug build for e2e
        if: runner.os == 'Linux'
        working-directory: desktop/src-tauri
        run: cargo build

      - name: End-to-end (launch real app against fixture home under Xvfb)
        if: runner.os == 'Linux'
        working-directory: desktop
        env:
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          SKILLED_E2E_KEEP: "1"
        run: xvfb-run -a -s "-screen 0 1400x900x24" bun test tests/e2e --timeout 120000

      - name: Screenshots + recording from the e2e tour
        if: runner.os == 'Linux'
        working-directory: desktop
        env:
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        run: xvfb-run -a -s "-screen 0 1400x900x24" sh scripts/capture.sh --record

      - name: Upload screenshots + recording
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-e2e-media
          path: |
            desktop/docs/*.png
            desktop/docs/tour.*
            desktop/docs/e2e-report.json

      - name: Build bundles
        working-directory: desktop
        run: bun run tauri build ${{ matrix.args }}

      - name: Collect bundles (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p out
          find desktop/src-tauri/target -path '*/release/bundle/*' \
            \( -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) -exec cp {} out/ \;
          ls -la out

      - name: Collect bundles (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Get-ChildItem -Recurse desktop/src-tauri/target -Include *.msi,*-setup.exe | ForEach-Object { Copy-Item $_.FullName out/ }
          Get-ChildItem out

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: skilled-desktop-${{ matrix.name }}
          path: out/*
          if-no-files-found: error
