[package]
name = "skilled-index"
version = "0.4.0"
edition = "2021"

[lib]
name = "skilled_index"
path = "src/lib.rs"

[[bin]]
name = "skilled-index"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
regex = "1"
walkdir = "2"
urlencoding = "2"

[profile.release]
lto = true
strip = true
