[package]
name = "skilled-desktop"
version = "0.3.3"
description = "Desktop app for Skilled: local skill usage insights for AI coding tools"
authors = ["av"]
license = "MIT"
edition = "2021"

[lib]
name = "skilled_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
skilled-index = { path = "../../index" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
notify-debouncer-mini = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2"
cairo-rs = { version = "0.18", features = ["png"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
